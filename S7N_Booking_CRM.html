<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S7N — Booking CRM Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #09090d;
  --surface: #111118;
  --surface2: #18181f;
  --border: #1e1e2a;
  --red: #c0392b;
  --red-dim: rgba(192,57,43,0.15);
  --gold: #8B7536;
  --green: #2e7d52;
  --blue: #1a6fa8;
  --purple: #6b3fa0;
  --text: #e4e2ee;
  --text-dim: #7a7890;
  --text-muted: #3d3b55;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); font-family:'Barlow',sans-serif; color:var(--text); min-height:100vh; }

/* HEADER */
.header {
  background: linear-gradient(135deg, #0c0c14 0%, #12121c 100%);
  border-bottom: 2px solid var(--red);
  padding: 20px 32px;
  display: flex;
  align-items: center;
  gap: 24px;
  position: sticky; top: 0; z-index: 100;
}
.logo { font-family:'Bebas Neue',sans-serif; font-size:42px; letter-spacing:4px; color:var(--text); line-height:1; }
.logo span { color:var(--red); }
.header-subtitle { font-size:11px; color:var(--text-dim); letter-spacing:3px; text-transform:uppercase; }
.header-stats { margin-left:auto; display:flex; gap:24px; }
.stat { text-align:center; }
.stat-num { font-family:'Bebas Neue',sans-serif; font-size:28px; color:var(--red); line-height:1; }
.stat-label { font-size:10px; color:var(--text-muted); letter-spacing:2px; text-transform:uppercase; }

/* TOOLBAR */
.toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 32px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  position: sticky; top: 82px; z-index: 99;
}
.search-box {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px;
  font-family: 'Barlow', sans-serif;
  font-size: 13px;
  width: 240px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box:focus { border-color: var(--red); }
.search-box::placeholder { color: var(--text-muted); }

.filter-group { display:flex; gap:6px; align-items:center; }
.filter-label { font-size:10px; color:var(--text-muted); letter-spacing:2px; text-transform:uppercase; margin-right:4px; }
.filter-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 6px 12px;
  font-family: 'Barlow', sans-serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
  cursor:pointer;
  text-transform:uppercase;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--red); color: var(--text); }
.filter-btn.active { background: var(--red); border-color: var(--red); color: #fff; }
.filter-btn.active-green { background: var(--green); border-color: var(--green); color: #fff; }
.filter-btn.active-blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.filter-btn.active-purple { background: var(--purple); border-color: var(--purple); color: #fff; }

.results-count { margin-left:auto; font-size:12px; color:var(--text-muted); letter-spacing:1px; }

/* MAIN LAYOUT */
.main { display:flex; height:calc(100vh - 138px); }

/* CONTACT LIST */
.contact-list {
  width: 380px;
  min-width: 380px;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  background: var(--surface);
}
.contact-list::-webkit-scrollbar { width:4px; }
.contact-list::-webkit-scrollbar-track { background:var(--bg); }
.contact-list::-webkit-scrollbar-thumb { background:var(--border); }

.contact-item {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
}
.contact-item:hover { background: var(--surface2); }
.contact-item.selected { background: var(--red-dim); border-left: 3px solid var(--red); padding-left:15px; }
.contact-item.done { opacity: 0.45; }
.contact-item.done .contact-name { text-decoration: line-through; }

.contact-name { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px; margin-bottom:3px; }
.contact-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.contact-type { font-size:10px; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase; }
.contact-city { font-size:11px; color:var(--text-dim); }
.priority-pill {
  font-size:9px; font-weight:700; letter-spacing:1px;
  padding:2px 6px; text-transform:uppercase;
  flex-shrink:0;
}
.p-urgent { background:var(--red); color:#fff; }
.p-high { background:rgba(139,117,54,0.3); color:#c9a84c; border:1px solid var(--gold); }
.p-mid { background:rgba(26,111,168,0.2); color:#5aa4d4; border:1px solid var(--blue); }
.p-low { background:rgba(40,40,60,0.5); color:var(--text-muted); border:1px solid var(--border); }

.market-dot {
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
}
.dot-usa { background:#c0392b; }
.dot-eu { background:#2e7d52; }
.dot-asia { background:#1a6fa8; }

/* DETAIL PANEL */
.detail-panel {
  flex:1;
  overflow-y:auto;
  padding:32px;
  background: var(--bg);
}
.detail-panel::-webkit-scrollbar { width:4px; }
.detail-panel::-webkit-scrollbar-track { background:var(--bg); }
.detail-panel::-webkit-scrollbar-thumb { background:var(--border); }

.empty-state {
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--text-muted);
  gap:12px;
}
.empty-icon { font-family:'Bebas Neue',sans-serif; font-size:80px; color:var(--border); letter-spacing:4px; }
.empty-text { font-size:13px; letter-spacing:2px; text-transform:uppercase; }

.detail-header { margin-bottom:24px; }
.detail-type-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.detail-type-badge { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--red); font-weight:700; }
.detail-name { font-family:'Bebas Neue',sans-serif; font-size:36px; letter-spacing:2px; color:var(--text); line-height:1.1; margin-bottom:6px; }
.detail-city { font-size:14px; color:var(--text-dim); }

.detail-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}
.detail-card {
  background:var(--surface);
  border:1px solid var(--border);
  padding:16px 18px;
}
.detail-card-label {
  font-size:10px; letter-spacing:3px; text-transform:uppercase;
  color:var(--text-muted); margin-bottom:6px;
}
.detail-card-value { font-size:14px; color:var(--text); line-height:1.5; }
.detail-card-value a { color:var(--red); text-decoration:none; }
.detail-card-value a:hover { text-decoration:underline; }

.priority-block {
  background:var(--red-dim);
  border-left:3px solid var(--red);
  padding:14px 18px;
  margin-bottom:16px;
}
.priority-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--red); margin-bottom:4px; }
.priority-value { font-size:14px; color:var(--text); font-weight:600; }

.strategy-block {
  background:var(--surface);
  border:1px solid var(--border);
  border-top:2px solid var(--gold);
  padding:16px 18px;
  margin-bottom:16px;
}
.strategy-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
.strategy-text { font-size:14px; color:var(--text-dim); line-height:1.7; }

.notes-block {
  background:var(--surface2);
  border:1px solid var(--border);
  padding:16px 18px;
  margin-bottom:16px;
}
.notes-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
.notes-text { font-size:13px; color:var(--text-dim); line-height:1.7; }

.tags-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
.tag {
  font-size:10px; font-weight:600; letter-spacing:1px;
  padding:3px 8px; text-transform:uppercase;
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text-muted);
}

/* ACTION BUTTONS */
.actions { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; }
.btn {
  font-family:'Bebas Neue',sans-serif;
  font-size:14px; letter-spacing:2px;
  padding:10px 20px;
  cursor:pointer;
  border:none;
  text-decoration:none;
  display:inline-block;
  transition:opacity 0.15s;
}
.btn:hover { opacity:0.85; }
.btn-email { background:var(--red); color:#fff; }
.btn-web { background:var(--surface); border:1px solid var(--border); color:var(--text); }
.btn-done { background:var(--surface); border:1px solid var(--green); color:#4daa7a; }
.btn-done.is-done { background:var(--green); color:#fff; }

/* STATUS TRACKER */
.status-section { margin-top:16px; }
.status-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px; }
.status-options { display:flex; gap:8px; flex-wrap:wrap; }
.status-opt {
  font-size:11px; font-weight:600; letter-spacing:1px;
  padding:6px 12px; text-transform:uppercase;
  cursor:pointer;
  background:var(--surface); border:1px solid var(--border);
  color:var(--text-muted);
  transition:all 0.15s;
}
.status-opt:hover { border-color:var(--red); color:var(--text); }
.status-opt.active { background:var(--red); border-color:var(--red); color:#fff; }
.status-opt.s-contacted { }
.status-opt.s-replied { background:rgba(139,117,54,0.2); border-color:var(--gold); color:#c9a84c; }
.status-opt.s-meeting { background:rgba(26,111,168,0.2); border-color:var(--blue); color:#5aa4d4; }
.status-opt.s-booked { background:rgba(46,125,82,0.2); border-color:var(--green); color:#4daa7a; }
.status-opt.s-pass { background:rgba(60,30,30,0.3); border-color:#5a2020; color:#884444; }

.notes-textarea {
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px;
  font-family:'Barlow',sans-serif;
  font-size:13px;
  min-height:80px;
  resize:vertical;
  outline:none;
  margin-top:8px;
  transition:border-color 0.2s;
  line-height:1.6;
}
.notes-textarea:focus { border-color:var(--red); }
.notes-textarea::placeholder { color:var(--text-muted); }

.save-note-btn {
  margin-top:8px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-dim);
  padding:6px 14px;
  font-family:'Bebas Neue',sans-serif;
  font-size:13px;
  letter-spacing:2px;
  cursor:pointer;
  transition:all 0.15s;
}
.save-note-btn:hover { border-color:var(--red); color:var(--text); }

/* MARKET SECTION HEADERS */
.list-section-header {
  padding:10px 18px;
  background:var(--bg);
  font-family:'Bebas Neue',sans-serif;
  font-size:12px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--text-muted);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10;
}
.list-section-header.usa { color:#c0392b; background:rgba(192,57,43,0.05); }
.list-section-header.eu { color:#2e7d52; background:rgba(46,125,82,0.05); }
.list-section-header.asia { color:#1a6fa8; background:rgba(26,111,168,0.05); }

/* RESPONSIVE */
@media (max-width:900px) {
  .contact-list { width:100%; min-width:unset; }
  .main { flex-direction:column; height:auto; }
  .detail-panel { padding:20px; }
  .detail-grid { grid-template-columns:1fr; }
}
</style>
</head>

<div class="main">

</div>

// State
let state = {
  filter_market: 'all',
  filter_priority: 'all',
  filter_status: 'all',
  search: '',
  selected: null,
  statuses: {},  // id -> status string
  user_notes: {},  // id -> string
};

// Load from localStorage
try {
  const saved = localStorage.getItem('s7n_crm');
  if (saved) {
    const parsed = JSON.parse(saved);
    state.statuses = parsed.statuses || {};
    state.user_notes = parsed.user_notes || {};
  }
} catch(e) {}

function save() {
  try {
    localStorage.setItem('s7n_crm', JSON.stringify({
      statuses: state.statuses,
      user_notes: state.user_notes
    }));
  } catch(e) {}
  updateStats();
}

function priorityLevel(p) {
  if (p.includes('ENTRADA ÓPTIMA') || p.includes('CRÍTICO') || p.includes('Inmediato') || p.includes('★')) return 'urgent';
  if (p.includes('Major') || p.includes('PRIORITARIO') || p.includes('ESTRATÉGICO')) return 'high';
  if (p.includes('B —') || p.includes('Mid')) return 'mid';
  return 'low';
}

function priorityClass(p) {
  const l = priorityLevel(p);
  if (l === 'urgent') return 'p-urgent';
  if (l === 'high') return 'p-high';
  if (l === 'mid') return 'p-mid';
  return 'p-low';
}

function marketDot(m) {
  if (m === 'USA') return 'dot-usa';
  if (m === 'Europa') return 'dot-eu';
  return 'dot-asia';
}

function filterContacts() {
  return CONTACTS.filter(c => {
    if (state.filter_market !== 'all' && c.market !== state.filter_market) return false;
    if (state.filter_priority !== 'all' && priorityLevel(c.priority) !== state.filter_priority) return false;
    if (state.filter_status !== 'all') {
      const st = state.statuses[c.id] || 'pending';
      if (st !== state.filter_status) return false;
    }
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!c.name.toLowerCase().includes(q) &&
          !c.city.toLowerCase().includes(q) &&
          !c.email.toLowerCase().includes(q) &&
          !c.type.toLowerCase().includes(q) &&
          !(c.notes || '').toLowerCase().includes(q) &&
          !(c.strategy || '').toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function renderList() {
  const filtered = filterContacts();
  const list = document.getElementById('contact-list');
  document.getElementById('results-count').textContent = `Showing ${filtered.length} contact${filtered.length!==1?'s':''}`;
  
  if (filtered.length === 0) {
    list.innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-muted);font-size:13px;letter-spacing:2px;text-transform:uppercase">No contacts found</div>';
    return;
  }

  // Group by market
  const groups = {};
  filtered.forEach(c => {
    if (!groups[c.market]) groups[c.market] = [];
    groups[c.market].push(c);
  });

  const order = ['USA', 'Europa', 'Japón/Asia'];
  const marketClass = {'USA':'usa','Europa':'eu','Japón/Asia':'asia'};
  const marketEmoji = {'USA':'🇺🇸 USA','Europa':'🇪🇺 Europa','Japón/Asia':'🇯🇵 Japan & Asia'};

  let html = '';
  order.forEach(m => {
    if (!groups[m]) return;
    html += `<div class="list-section-header ${marketClass[m]}">${marketEmoji[m]} · ${groups[m].length} contacts</div>`;
    groups[m].forEach(c => {
      const status = state.statuses[c.id] || 'pending';
      const isDone = status === 'booked' || status === 'pass';
      const pl = priorityLevel(c.priority);
      const pillLabel = pl === 'urgent' ? '★ URGENT' : pl === 'high' ? 'HIGH' : pl === 'mid' ? 'MID' : 'LOW';
      html += `
        <div class="contact-item${state.selected===c.id?' selected':''}${isDone?' done':''}" onclick="selectContact(${c.id})">
          <div class="contact-name">${c.name}</div>
          <div class="contact-meta">
            <div class="market-dot ${marketDot(c.market)}"></div>
            <span class="contact-type">${c.type}</span>
            <span class="contact-city">${c.city.split('/')[0].trim()}</span>
            <span class="priority-pill ${priorityClass(c.priority)}">${pillLabel}</span>
            ${status !== 'pending' ? `<span style="font-size:9px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;background:var(--surface2);padding:2px 6px;">${status.toUpperCase()}</span>` : ''}
          </div>
        </div>
      `;
    });
  });

  list.innerHTML = html;
}

function selectContact(id) {
  state.selected = id;
  renderList();
  renderDetail();
}

function renderDetail() {
  const panel = document.getElementById('detail-panel');
  if (!state.selected) {
    panel.innerHTML = '<div class="empty-state"><div class="empty-icon">S7N</div><div class="empty-text">Select a contact to view details</div></div>';
    return;
  }
  const c = CONTACTS.find(x => x.id === state.selected);
  if (!c) return;

  const status = state.statuses[c.id] || 'pending';
  const userNote = state.user_notes[c.id] || '';
  const statuses = ['pending','contacted','replied','meeting','booked','pass'];
  const statusLabels = {'pending':'📋 Pending','contacted':'📧 Contacted','replied':'💬 Replied','meeting':'🤝 Meeting','booked':'✅ Booked','pass':'❌ Pass'};

  const emailHref = c.email ? `mailto:${c.email}?subject=Booking%20Inquiry%20%E2%80%94%20S7N%202026` : '';

  panel.innerHTML = `
    <div class="detail-header">
      <div class="detail-type-row">
        <span class="detail-type-badge">${c.market} · ${c.type}</span>
      </div>
      <div class="detail-name">${c.name}</div>
      <div class="detail-city">${c.city}</div>
    </div>

    <div class="priority-block">
      <div class="priority-label">Priority Level</div>
      <div class="priority-value">${c.priority}</div>
    </div>

    <div class="actions">
      ${c.email ? `<a href="${emailHref}" class="btn btn-email">✉ Send Email</a>` : '<span class="btn btn-web" style="opacity:0.4;cursor:default">No Email Listed</span>'}
      ${c.web ? `<a href="https://${c.web}" target="_blank" class="btn btn-web">🌐 Website</a>` : ''}
    </div>

    <div class="detail-grid">
      ${c.email ? `<div class="detail-card"><div class="detail-card-label">Email</div><div class="detail-card-value"><a href="${emailHref}">${c.email}</a></div></div>` : ''}
      ${c.web ? `<div class="detail-card"><div class="detail-card-label">Website</div><div class="detail-card-value"><a href="https://${c.web}" target="_blank">${c.web}</a></div></div>` : ''}
      ${c.contact_person ? `<div class="detail-card" style="grid-column:1/-1"><div class="detail-card-label">Key Contact</div><div class="detail-card-value">${c.contact_person}</div></div>` : ''}
    </div>

    <div class="strategy-block">
      <div class="strategy-label">🎯 Booking Strategy</div>
      <div class="strategy-text">${c.strategy}</div>
    </div>

    <div class="notes-block">
      <div class="notes-label">Notes & Background</div>
      <div class="notes-text">${c.notes}</div>
    </div>

    <div class="tags-row">
      ${(c.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
    </div>

    <div class="status-section">
      <div class="status-label">Status Tracker</div>
      <div class="status-options">
        ${statuses.map(s=>`
          <div class="status-opt s-${s}${status===s?' active':''}" onclick="setStatus(${c.id},'${s}')">${statusLabels[s]}</div>
        `).join('')}
      </div>
    </div>

    <div style="margin-top:20px">
      <div class="status-label">Personal Notes</div>
      <textarea class="notes-textarea" id="user-note-ta" placeholder="Add your notes, follow-up dates, responses...">${userNote}</textarea>
      <button class="save-note-btn" onclick="saveNote(${c.id})">SAVE NOTE</button>
    </div>
  `;
}

function setStatus(id, status) {
  state.statuses[id] = status;
  save();
  renderList();
  renderDetail();
}

function saveNote(id) {
  const ta = document.getElementById('user-note-ta');
  if (ta) {
    state.user_notes[id] = ta.value;
    save();
    const btn = document.querySelector('.save-note-btn');
    if (btn) { btn.textContent = 'SAVED ✓'; setTimeout(()=>{if(btn)btn.textContent='SAVE NOTE';}, 1500); }
  }
}

function updateStats() {
  const urgent = CONTACTS.filter(c => priorityLevel(c.priority) === 'urgent').length;
  const contacted = Object.values(state.statuses).filter(s => ['contacted','replied','meeting'].includes(s)).length;
  const booked = Object.values(state.statuses).filter(s => s === 'booked').length;
  document.getElementById('urgent-count').textContent = urgent;
  document.getElementById('contacted-count').textContent = contacted;
  document.getElementById('booked-count').textContent = booked;
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const filterType = btn.dataset.filter;
    const value = btn.dataset.value;
    
    // Remove active from same group
    document.querySelectorAll(`[data-filter="${filterType}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    if (filterType === 'market') state.filter_market = value;
    if (filterType === 'priority') state.filter_priority = value;
    if (filterType === 'status') state.filter_status = value;
    
    renderList();
  });
});

// Search
document.getElementById('search-input').addEventListener('input', e => {
  state.search = e.target.value;
  renderList();
});

// Init
updateStats();
renderList();
</script>
